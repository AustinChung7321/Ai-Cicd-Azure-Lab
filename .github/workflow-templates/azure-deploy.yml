name: Azure deploy template

# 這是課程用範本，不會自動執行。
# 完成 OIDC、Azure Container Registry 與 Container Apps 設定後，
# 請複製到 .github/workflows/azure-deploy.yml 再啟用。

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          az acr build \
            --registry "${{ vars.AZURE_CONTAINER_REGISTRY }}" \
            --image "ai-cicd-azure-lab:${{ github.sha }}" \
            .

      - name: Update Azure Container App
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/ai-cicd-azure-lab:${{ github.sha }}"
